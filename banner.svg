<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1b2547"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#7c9bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <rect width="900" height="220" rx="16" fill="none" stroke="#242938" stroke-width="1.5"/>

  <text x="450" y="110" text-anchor="middle" font-family="Segoe UI, Consolas, monospace" font-size="52" font-weight="800" fill="url(#text-grad)" filter="url(#glow)">
    ELTON GARCIA
  </text>

  <text x="450" y="150" text-anchor="middle" font-family="Segoe UI, Consolas, monospace" font-size="18" fill="#9aa3b8">
    Desenvolvedor Full Stack &#183; Ciberseguran&#231;a &amp; Pentest
  </text>

  <text x="450" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#555c70">
    github.com/EltongarciaTI
  </text>
</svg>
